let sortCol=-1, sortDir=1;
const filters=LABELS.map(()=> "");
const hrow=document.getElementById('hrow');
function uniqueVals(i){
  const set=[...new Set(DATA.map(r=>r[i]).filter(v=>v!==''))];
  set.sort((a,b)=> NUMERIC[i] ? (a-b) : String(a).localeCompare(String(b),'nl'));
  return set;
}
LABELS.forEach((lab,i)=>{
  const th=document.createElement('th');
  const wrap=document.createElement('div'); wrap.className='th-label';
  wrap.innerHTML='<span>'+lab+'</span><span class="arrow" data-i="'+i+'"></span>';
  wrap.onclick=()=>{ if(sortCol===i){sortDir*=-1;} else {sortCol=i;sortDir=1;} render(); };
  th.appendChild(wrap);
  let ctrl;
  if(SELECTS[i]){
    ctrl=document.createElement('select');
    const opt0=document.createElement('option'); opt0.value=''; opt0.textContent='(alle)';
    ctrl.appendChild(opt0);
    uniqueVals(i).forEach(v=>{ const o=document.createElement('option'); o.value=String(v); o.textContent=String(v); ctrl.appendChild(o); });
    ctrl.onchange=e=>{ filters[i]=e.target.value; render(); };
  } else {
    ctrl=document.createElement('input'); ctrl.type='text'; ctrl.placeholder='filter…';
    ctrl.oninput=e=>{ filters[i]=e.target.value.toLowerCase(); render(); };
  }
  ctrl.onclick=e=>e.stopPropagation();
  th.appendChild(ctrl); hrow.appendChild(th);
});
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function match(v,i){
  if(filters[i]==='') return true;
  return SELECTS[i] ? String(v)===filters[i] : String(v).toLowerCase().includes(filters[i]);
}
function render(){
  let rows=DATA.filter(r=> r.every((v,i)=> match(v,i)));
  if(sortCol>=0){
    rows=rows.slice().sort((a,b)=>{
      let x=a[sortCol], y=b[sortCol];
      if(NUMERIC[sortCol]){ x=(x===''?-Infinity:+x); y=(y===''?-Infinity:+y); return (x-y)*sortDir; }
      return String(x).localeCompare(String(y),'nl')*sortDir;
    });
  }
  document.getElementById('body').innerHTML = rows.length
    ? rows.map(r=>'<tr>'+r.map((v,i)=>'<td'+(NUMERIC[i]?' class="num"':'')+'>'+escapeHtml(v)+'</td>').join('')+'</tr>').join('')
    : '<tr><td class="noresult" colspan="'+LABELS.length+'">Geen resultaten</td></tr>';
  document.getElementById('count').textContent = rows.length+' van '+DATA.length+' rijen';
  document.querySelectorAll('.arrow').forEach(a=>{const i=+a.dataset.i; a.textContent=(i===sortCol)?(sortDir>0?'▲':'▼'):'';});
}
render();
